<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As Aventuras de Miguel e Batman</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { margin-bottom: 8px; font-size: 26px; color: #ffd700; text-shadow: 2px 2px 4px #000; }
        #canvas-container {
            position: relative;
            border: 4px solid #222;
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.9);
            background-color: #1e4620;
        }
        canvas { display: block; image-rendering: pixelated; }
        #ui {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.75);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #444;
        }
        .hint { margin-top: 6px; color: #aaa; font-size: 13px; }

        /* Modal Interativo */
        #interactive-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #0277bd;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 10;
            width: 340px;
        }
        #interactive-modal h2 {
            color: #4fc3f7;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .modal-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0288d1;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-btn:hover {
            background: #039be5;
        }
        .modal-btn.close {
            background: #546e7a;
            margin-top: 15px;
        }
        .modal-btn.close:hover {
            background: #78909c;
        }
    </style>
</head>
<body>

    <h1>⚔️ As Aventuras de Miguel e Batman</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="960" height="640"></canvas>

        <div id="interactive-modal">
            <h2 id="modal-title">🏡 Casa da Vovó Rosilene</h2>
            <p style="margin-bottom: 15px; color: #ddd; font-size: 14px;">O que os meninos querem fazer agora?</p>
            <button class="modal-btn" onclick="escolherOpcao('piscina')">🏊‍♂️ Ir para a Piscina</button>
            <button class="modal-btn" onclick="escolherOpcao('vovo')">👴 Brincar com o Vovô</button>
            <button class="modal-btn close" onclick="fecharModal()">Voltar ao Mapa</button>
        </div>
    </div>

    <div id="ui">
        <div>⭐ Pontos: <span id="score" style="color: #ffd700;">0</span></div>
        <div>❤️ Vidas: <span id="lives" style="color: #ff4d4d;">3</span></div>
        <div>🏆 Nível: <span id="level" style="color: #00e5ff;">1</span></div>
    </div>
    <div class="hint">Aproxime-se da Casa da Vovó Rosilene para abrir as opções!</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let lives = 3;
let cenaAtual = 'mapa'; // 'mapa', 'piscina', 'vovo'
let modalAberto = false;

// --- GERADOR DE SPRITES EM PIXEL ART ---
function gerarSprites() {
    const s = {};

    // 1. Árvore em Pixel Art
    const cTree = document.createElement('canvas'); 
    cTree.width = 64; cTree.height = 96;
    const dT = cTree.getContext('2d');
    const pixelMapTree = [
        ".................BBBB...........",
        "...............BBGGGBB..........",
        "..............BGGGGGGGB.........",
        "............BBGGGGGGGGGBB.......",
        "...........BGGGGGGGGGGGGGB......",
        "..........BGGGGGGGGGGGGGGGB.....",
        ".........BGGGGGGGGGGGGGGGGGB....",
        "........BGGGGBBBGGGGGGGGGGGB....",
        "........BGGGBBBBGGGGGBBBGGGB....",
        ".......BGGGGBBBBBGGGBBBBGGGGB...",
        "......BGGGGGBBBBBBGGBBBBBGGGB...",
        "......BGGGGGGBBBBBBBBBBBGGGGB...",
        ".....BGGGGGGGBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGBBBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGBBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGBBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGGBBBBBBBBBBGGGGGB...",
        "......BGGGGGGGBBBBBBBBGGGGGB....",
        "......BGGGGGGGGBBBBBGGGGGGGB....",
        ".......BGGGGGGGGGGGGGGGGGGGB....",
        "........BGGGGGGGGGGGGGGGGGB.....",
        ".........BBGGGGGGGGGGGGGBB......",
        "...........BBGGGGGGGGGBB........",
        ".............BBBBBBBBB..........",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "..............BBTTTBB...........",
        ".............BTTTTTTTB..........",
        ".............BGGGGGGGB..........",
        "..............BBBBBBB..........."
    ];
    const scaleTree = 2;
    for (let r = 0; r < pixelMapTree.length; r++) {
        for (let c = 0; c < pixelMapTree[r].length; c++) {
            const char = pixelMapTree[r][c];
            if (char === '.') continue;
            if (char === 'B') dT.fillStyle = '#000000';
            else if (char === 'G') {
                if (r < 10) dT.fillStyle = '#4ae24a';
                else if (r < 20) dT.fillStyle = '#22b14c';
                else dT.fillStyle = '#158033';
            }
            else if (char === 'T') dT.fillStyle = '#8b4513';
            dT.fillRect(c * scaleTree, r * scaleTree, scaleTree, scaleTree);
        }
    }
    s.arvore = cTree;

    // 2. Estrada
    const cRoad = document.createElement('canvas'); cRoad.width = 64; cRoad.height = 64;
    const dR = cRoad.getContext('2d');
    dR.fillStyle = '#787884'; dR.fillRect(0,0,64,64);
    for(let y=0; y<64; y+=8) {
        let offset = (y % 16 === 0) ? 0 : 8;
        for(let x=0; x<64; x+=16) {
            let px = x + offset;
            dR.fillStyle = '#9aa0a8'; dR.fillRect(px+1, y+1, 14, 6);
            dR.fillStyle = '#565660'; dR.fillRect(px, y, 16, 1); dR.fillRect(px, y, 1, 8);
            dR.fillStyle = '#b0b8c2'; dR.fillRect(px+2, y+2, 12, 1);
        }
    }
    s.estrada = cRoad;

    // 3. Batman Pixel Art
    const cBat = document.createElement('canvas'); cBat.width = 64; cBat.height = 64;
    const dBat = cBat.getContext('2d');
    const pixelMapBatman = [
        "........K.....K........",
        "........KK...KK........",
        ".......KKKK.KKKK.......",
        ".......KKKKKKKKK.......",
        ".......KKGKKKGGK.......",
        ".......KKWWKKWWK.......",
        ".......KKKKKKKKK.......",
        "........KKFEEFK........",
        "........KKKKKKK........",
        ".......KKGGGGGGK.......",
        "......KGGGGGGGGGK......",
        ".....KGGGGGGGGGGGK.....",
        ".....KGGGGGGGGGGGK.....",
        "....KKKKYYYYYYYKKKK....",
        "....KKKKKGGGGGGKKKK....",
        "....KKKKGGGGGGGKKKK....",
        ".....KKKGG...GGKKK.....",
        ".....KKKGG...GGKKK.....",
        ".....KKKGG...GGKKK.....",
        ".....KKKKK...KKKKK.....",
        ".....KKKKK...KKKKK....."
    ];
    const scaleB = 2.5;
    for (let r = 0; r < pixelMapBatman.length; r++) {
        for (let c = 0; c < pixelMapBatman[r].length; c++) {
            const char = pixelMapBatman[r][c];
            if (char === '.') continue;
            if (char === 'K') dBat.fillStyle = '#1e1e24';
            else if (char === 'G') dBat.fillStyle = '#7a7e85';
            else if (char === 'W') dBat.fillStyle = '#ffffff';
            else if (char === 'F') dBat.fillStyle = '#ffcc80';
            else if (char === 'E') dBat.fillStyle = '#d7ccc8';
            else if (char === 'Y') dBat.fillStyle = '#d4a017';
            dBat.fillRect(c * scaleB, r * scaleB, scaleB, scaleB);
        }
    }
    s.batman = cBat;

    // 4. Miguel
    const cMig = document.createElement('canvas'); cMig.width = 64; cMig.height = 64;
    const dMig = cMig.getContext('2d');
    const pixelMapMiguel = [
        "..................HH..............",
        ".............SHHH.HHHH............",
        "............SHHHHHHHHH............",
        "...........SHHHHHHHHHHH...........",
        "...........SHHHHHHHHHHH...........",
        "..........SHHFFFFFFFFFFHH.........",
        ".........SHHFFFEFFFEFFFFHH........",
        ".........SHHFFFFFFFFFFEEFF........",
        ".........SHHFFFFFEFFFFFFEE........",
        "..........SHFFFFFEEEEEEFFF........",
        "..........S.FFFFFFFFFF............",
        ".........S.AAACCCCCCCAAAA.........",
        "........S.AAAACCCCCCCAAAAA........",
        ".......S..AAAACCCCCCCAAAAAA.......",
        "......S...AAAACCCCCCCAAAAAAA......",
        ".....S....PPPPP.PPPPP.............",
        "....S....PPPPPP.PPPPPP............",
        "...S....PPPPPPP.PPPPPPP...........",
        "..S....WWWWWWWW.WWWWWWWW..........",
        ".......WWWWWWWW.WWWWWWWW..........",
        "........RRRRRR...RRRRRR...........",
        ".......RRRRRRRR.RRRRRRRR..........",
        "......RRRRRRRRRRRRRRRRRRR.........",
        "......RRRRRRRRRRRRRRRRRRR.........",
        ".......RRRRRRRR.RRRRRRRR..........",
        "........RRRRRR...RRRRRR...........",
        "..........R........R.............."
    ];
    const scaleM = 2;
    for (let r = 0; r < pixelMapMiguel.length; r++) {
        for (let c = 0; c < pixelMapMiguel[r].length; c++) {
            const char = pixelMapMiguel[r][c];
            if (char === '.') continue;
            if (char === 'H') dMig.fillStyle = '#6d4c41';
            else if (char === 'F') dMig.fillStyle = '#ffcc80';
            else if (char === 'E') dMig.fillStyle = '#1a237e';
            else if (char === 'A') dMig.fillStyle = '#29b6f6';
            else if (char === 'P') dMig.fillStyle = '#263238';
            else if (char === 'W') dMig.fillStyle = '#eceff1';
            else if (char === 'S') dMig.fillStyle = '#b0bec5';
            else if (char === 'C') dMig.fillStyle = '#1565c0';
            else if (char === 'R') dMig.fillStyle = '#37474f';
            dMig.fillRect(c * scaleM, r * scaleM, scaleM, scaleM);
        }
    }
    s.miguel = cMig;

    // 5. Construções
    function criarPredio(corParede, rotulo) {
        const cP = document.createElement('canvas'); cP.width = 160; cP.height = 120;
        const dP = cP.getContext('2d');
        dP.fillStyle = corParede; dP.fillRect(10, 35, 140, 80);
        dP.strokeStyle = '#1a1a1a'; dP.lineWidth = 4; dP.strokeRect(10, 35, 140, 80);
        dP.fillStyle = '#b71c1c';
        dP.beginPath(); dP.moveTo(0,35); dP.lineTo(80,5); dP.lineTo(160,35); dP.closePath(); dP.fill(); dP.stroke();
        dP.fillStyle = '#4e342e'; dP.fillRect(65, 75, 30, 40); dP.strokeRect(65, 75, 30, 40);
        dP.fillStyle = '#fff8e1'; dP.fillRect(25, 50, 26, 26); dP.fillRect(109, 50, 26, 26);
        dP.strokeRect(25, 50, 26, 26); dP.strokeRect(109, 50, 26, 26);
        dP.fillStyle = '#ffffff'; dP.fillRect(20, 10, 120, 18); dP.strokeRect(20, 10, 120, 18);
        dP.fillStyle = '#000000'; dP.font = 'bold 11px sans-serif'; dP.textAlign = 'center';
        dP.fillText(rotulo, 80, 23);
        return cP;
    }

    s.casa_mariangela = criarPredio('#ef6c00', 'Casa Mariangela');
    s.casa_rosilene = criarPredio('#0277bd', 'Casa Rosilene');
    s.escola = criarPredio('#2e7d32', 'Escola');
    s.igreja = criarPredio('#6a1b9a', 'Igreja');

    // 6. Imagem da Piscina (Conteúdo Interno)
    const cPiscina = document.createElement('canvas');
    cPiscina.width = 440; cPiscina.height = 260;
    const dP = cPiscina.getContext('2d');

    dP.fillStyle = '#87ceeb'; dP.fillRect(0, 0, 440, 120);
    dP.fillStyle = '#ffffff'; 
    dP.beginPath(); dP.arc(90, 40, 20, 0, Math.PI*2); dP.arc(110, 35, 25, 0, Math.PI*2); dP.arc(130, 40, 20, 0, Math.PI*2); dP.fill();
    dP.beginPath(); dP.arc(320, 45, 18, 0, Math.PI*2); dP.arc(340, 40, 22, 0, Math.PI*2); dP.arc(360, 45, 18, 0, Math.PI*2); dP.fill();

    dP.fillStyle = '#2e7d32';
    dP.beginPath(); dP.arc(50, 110, 40, 0, Math.PI*2); dP.fill();
    dP.beginPath(); dP.arc(100, 120, 35, 0, Math.PI*2); dP.fill();
    dP.beginPath(); dP.arc(330, 110, 30, 0, Math.PI*2); dP.fill();
    dP.beginPath(); dP.arc(380, 100, 40, 0, Math.PI*2); dP.fill();

    dP.fillStyle = '#ffe0b2'; dP.fillRect(0, 110, 440, 150);

    dP.fillStyle = '#29b6f6'; dP.beginPath(); dP.moveTo(50, 150); dP.lineTo(390, 150); dP.lineTo(425, 245); dP.lineTo(15, 245); dP.closePath(); dP.fill();
    dP.fillStyle = '#0288d1'; dP.fillRect(15, 240, 410, 8);

    dP.fillStyle = '#4fc3f7'; dP.beginPath(); dP.moveTo(60, 158); dP.lineTo(380, 158); dP.lineTo(410, 235); dP.lineTo(30, 235); dP.closePath(); dP.fill();

    dP.strokeStyle = 'rgba(255, 255, 255, 0.8)'; dP.lineWidth = 3;
    dP.beginPath(); dP.moveTo(150, 158); dP.lineTo(140, 235); dP.stroke();
    dP.beginPath(); dP.moveTo(230, 158); dP.lineTo(235, 235); dP.stroke();
    dP.beginPath(); dP.moveTo(310, 158); dP.lineTo(330, 235); dP.stroke();

    dP.fillStyle = '#cfd8dc'; dP.fillRect(60, 100, 8, 50);
    dP.fillStyle = '#37474f'; dP.fillRect(45, 90, 6, 60);
    for(let step=95; step<150; step+=8) { dP.fillRect(43, step, 10, 2); }
    dP.fillStyle = '#0288d1'; dP.fillRect(55, 90, 150, 10);
    dP.fillStyle = '#e0e0e0'; dP.fillRect(55, 87, 80, 3);
    dP.fillStyle = '#0277bd'; dP.beginPath(); dP.moveTo(110, 135); dP.lineTo(215, 105); dP.lineTo(220, 112); dP.lineTo(115, 142); dP.closePath(); dP.fill();

    dP.fillStyle = '#e91e63'; dP.beginPath(); dP.arc(370, 125, 25, Math.PI, 0); dP.closePath(); dP.fill();
    dP.fillStyle = '#ffffff'; dP.beginPath(); dP.moveTo(370, 125); dP.lineTo(355, 125); dP.lineTo(363, 100); dP.closePath(); dP.fill();
    dP.beginPath(); dP.moveTo(370, 125); dP.lineTo(385, 125); dP.lineTo(377, 100); dP.closePath(); dP.fill();
    dP.fillStyle = '#5d4037'; dP.fillRect(368, 125, 3, 35);

    dP.fillStyle = '#ffffff'; dP.fillRect(340, 150, 45, 6);
    dP.beginPath(); dP.moveTo(340, 150); dP.lineTo(328, 138); dP.lineTo(333, 135); dP.lineTo(345, 150); dP.closePath(); dP.fill();
    dP.fillStyle = '#00897b'; dP.fillRect(342, 145, 35, 5);

    s.piscina_img = cPiscina;

    // 7. Balão de Conversa em Pixel Art
    const cBubble = document.createElement('canvas');
    cBubble.width = 520; cBubble.height = 360;
    const dB = cBubble.getContext('2d');

    function drawPixelRect(x, y, w, h, color) {
        dB.fillStyle = color;
        dB.fillRect(x, y, w, h);
    }

    // Borda Externa Preta (Pixel Art)
    drawPixelRect(80, 0, 360, 270, '#000000');
    drawPixelRect(50, 20, 420, 230, '#000000');
    drawPixelRect(30, 40, 460, 190, '#000000');
    drawPixelRect(20, 70, 480, 130, '#000000');

    // Ponta do Balão
    drawPixelRect(180, 270, 40, 30, '#000000');
    drawPixelRect(190, 300, 30, 30, '#000000');
    drawPixelRect(200, 330, 20, 20, '#000000');

    // Preenchimento Interno Azul Claro / Sombra
    drawPixelRect(80, 10, 360, 250, '#53a8b6');
    drawPixelRect(40, 30, 440, 210, '#53a8b6');
    drawPixelRect(30, 70, 460, 130, '#53a8b6');

    // Ponta do Balão Interno
    drawPixelRect(190, 260, 20, 30, '#53a8b6');
    drawPixelRect(200, 290, 15, 30, '#53a8b6');

    // Centro Branco do Balão
    drawPixelRect(80, 16, 350, 238, '#e2ece9');
    drawPixelRect(40, 36, 430, 198, '#e2ece9');
    drawPixelRect(36, 70, 440, 130, '#e2ece9');

    s.balao_dialogo = cBubble;

    return s;
}

const SPRITES = gerarSprites();

const player = { x: 448, y: 280, speed: 4 };

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'Escape' && cenaAtual !== 'mapa') {
        voltarAoMapa();
    }
});
window.addEventListener('keyup', e => keys[e.key] = false);

function abrirModalCasaRosilene() {
    if (!modalAberto && cenaAtual === 'mapa') {
        modalAberto = true;
        document.getElementById('interactive-modal').style.display = 'block';
    }
}

function fecharModal() {
    modalAberto = false;
    document.getElementById('interactive-modal').style.display = 'none';
}

function escolherOpcao(opcao) {
    fecharModal();
    cenaAtual = opcao;
}

function voltarAoMapa() {
    cenaAtual = 'mapa';
    player.x = 610;
    player.y = 150;
}

function update() {
    if (modalAberto) return;

    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;

    if (cenaAtual === 'mapa') {
        player.x = Math.max(160, Math.min(canvas.width - 220, player.x));
        player.y = Math.max(20, Math.min(canvas.height - 80, player.y));

        if (player.x > 550 && player.x < 750 && player.y > 10 && player.y < 120) {
            abrirModalCasaRosilene();
        }
    } else {
        player.x = Math.max(50, Math.min(canvas.width - 120, player.x));
        player.y = Math.max(200, Math.min(canvas.height - 100, player.y));
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (cenaAtual === 'mapa') {
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < canvas.height; y += 64) {
            for (let x = 384; x < 576; x += 64) {
                ctx.drawImage(SPRITES.estrada, x, y);
            }
        }

        const posX = [20, 90, 800, 870];
        for (let x of posX) {
            for (let y = 10; y < canvas.height; y += 120) {
                ctx.drawImage(SPRITES.arvore, x, y);
            }
        }

        ctx.drawImage(SPRITES.casa_mariangela, 180, 20);
        ctx.drawImage(SPRITES.casa_rosilene, 610, 20);
        ctx.drawImage(SPRITES.escola, 180, 480);
        ctx.drawImage(SPRITES.igreja, 610, 480);

        ctx.drawImage(SPRITES.miguel, player.x, player.y);
        ctx.drawImage(SPRITES.batman, player.x + 40, player.y + 4);

    } else if (cenaAtual === 'piscina') {
        // Fundo do Mapa
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < canvas.height; y += 64) {
            for (let x = 384; x < 576; x += 64) {
                ctx.drawImage(SPRITES.estrada, x, y);
            }
        }
        ctx.drawImage(SPRITES.casa_rosilene, 610, 20);

        // Balão de Conversa
        const bx = 220;
        const by = 80;
        ctx.drawImage(SPRITES.balao_dialogo, bx, by);

        // Imagem da Piscina DENTRO do Balão
        ctx.drawImage(SPRITES.piscina_img, bx + 40, by + 22);

        // Personagens na frente
        ctx.drawImage(SPRITES.miguel, player.x, player.y);
        ctx.drawImage(SPRITES.batman, player.x + 40, player.y + 4);

        // Instrução para retornar
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(10, 10, 320, 36);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
        ctx.fillText('🏊‍♂️ Piscina no Balão! (Pressione ESC para voltar)', 20, 33);

    } else if (cenaAtual === 'vovo') {
        ctx.fillStyle = '#5d4037'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#d7ccc8'; ctx.fillRect(40, 40, 880, 560);

        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(10, 10, 360, 36);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
        ctx.fillText('👴 Brincando com o Vovô! (Pressione ESC para voltar)', 20, 33);

        ctx.drawImage(SPRITES.miguel, player.x, player.y);
        ctx.drawImage(SPRITES.batman, player.x + 40, player.y + 4);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
