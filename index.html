<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As Aventuras de Miguel e Batman</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { margin-bottom: 8px; font-size: 26px; color: #ffd700; text-shadow: 2px 2px 4px #000; }
        #canvas-container {
            position: relative;
            border: 4px solid #222;
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.9);
            background-color: #1e4620;
        }
        canvas { display: block; image-rendering: pixelated; }
        #ui {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.75);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #444;
        }
        .hint { margin-top: 6px; color: #888; font-size: 13px; }
    </style>
</head>
<body>

    <h1>⚔️ As Aventuras de Miguel e Batman</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
    </div>
    <div id="ui">
        <div>⭐ Pontos: <span id="score" style="color: #ffd700;">0</span></div>
        <div>❤️ Vidas: <span id="lives" style="color: #ff4d4d;">3</span></div>
        <div>🏆 Nível: <span id="level" style="color: #00e5ff;">1</span></div>
    </div>
    <div class="hint">Use as **Setas do Teclado** ou **WASD** para mover o Miguel e o Batman!</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let lives = 3;

// --- GERADOR DE SPRITES EM PIXEL ART ---
function gerarSprites() {
    const s = {};

    // 1. Árvore em Pixel Art Clássico
    const cTree = document.createElement('canvas'); 
    cTree.width = 64; 
    cTree.height = 96;
    const dT = cTree.getContext('2d');

    const pixelMapTree = [
        ".................BBBB...........",
        "...............BBGGGBB..........",
        "..............BGGGGGGGB.........",
        "............BBGGGGGGGGGBB.......",
        "...........BGGGGGGGGGGGGGB......",
        "..........BGGGGGGGGGGGGGGGB.....",
        ".........BGGGGGGGGGGGGGGGGGB....",
        "........BGGGGBBBGGGGGGGGGGGB....",
        "........BGGGBBBBGGGGGBBBGGGB....",
        ".......BGGGGBBBBBGGGBBBBGGGGB...",
        "......BGGGGGBBBBBBGGBBBBBGGGB...",
        "......BGGGGGGBBBBBBBBBBBGGGGB...",
        ".....BGGGGGGGBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGBBBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGBBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGBBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGGBBBBBBBBBBGGGGGB...",
        "......BGGGGGGGBBBBBBBBGGGGGB....",
        "......BGGGGGGGGBBBBBGGGGGGGB....",
        ".......BGGGGGGGGGGGGGGGGGGGB....",
        "........BGGGGGGGGGGGGGGGGGB.....",
        ".........BBGGGGGGGGGGGGGBB......",
        "...........BBGGGGGGGGGBB........",
        ".............BBBBBBBBB..........",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "..............BBTTTBB...........",
        ".............BTTTTTTTB..........",
        ".............BGGGGGGGB..........",
        "..............BBBBBBB..........."
    ];

    const scaleTree = 2;
    for (let r = 0; r < pixelMapTree.length; r++) {
        for (let c = 0; c < pixelMapTree[r].length; c++) {
            const char = pixelMapTree[r][c];
            if (char === '.') continue;

            if (char === 'B') dT.fillStyle = '#000000';
            else if (char === 'G') {
                if (r < 10) dT.fillStyle = '#4ae24a';
                else if (r < 20) dT.fillStyle = '#22b14c';
                else dT.fillStyle = '#158033';
            }
            else if (char === 'T') dT.fillStyle = '#8b4513';

            dT.fillRect(c * scaleTree, r * scaleTree, scaleTree, scaleTree);
        }
    }

    dT.fillStyle = '#0a2e0c';
    dT.fillRect(28, 18, 4, 24);
    dT.fillRect(24, 24, 12, 3);
    dT.fillRect(20, 30, 20, 3);
    dT.fillRect(18, 34, 10, 3);
    dT.fillRect(32, 22, 10, 3);

    s.arvore = cTree;

    // 2. Estrada de Paralelepípedo
    const cRoad = document.createElement('canvas'); cRoad.width = 64; cRoad.height = 64;
    const dR = cRoad.getContext('2d');
    dR.fillStyle = '#787884'; dR.fillRect(0,0,64,64);
    for(let y=0; y<64; y+=8) {
        let offset = (y % 16 === 0) ? 0 : 8;
        for(let x=0; x<64; x+=16) {
            let px = x + offset;
            dR.fillStyle = '#9aa0a8'; dR.fillRect(px+1, y+1, 14, 6);
            dR.fillStyle = '#565660'; dR.fillRect(px, y, 16, 1); dR.fillRect(px, y, 1, 8);
            dR.fillStyle = '#b0b8c2'; dR.fillRect(px+2, y+2, 12, 1);
        }
    }
    s.estrada = cRoad;

    // 3. Batman Pixel Art (Baseado na imagem enviada)
    const cBat = document.createElement('canvas'); 
    cBat.width = 64; 
    cBat.height = 64;
    const dBat = cBat.getContext('2d');

    const pixelMapBatman = [
        "........K.....K........",
        "........KK...KK........",
        ".......KKKK.KKKK.......",
        ".......KKKKKKKKK.......",
        ".......KKGKKKGGK.......",
        ".......KKWWKKWWK.......",
        ".......KKKKKKKKK.......",
        "........KKFEEFK........",
        "........KKKKKKK........",
        ".......KKGGGGGGK.......",
        "......KGGGGGGGGGK......",
        ".....KGGGGGGGGGGGK.....",
        ".....KGGGGGGGGGGGK.....",
        "....KKKKYYYYYYYKKKK....",
        "....KKKKKGGGGGGKKKK....",
        "....KKKKGGGGGGGKKKK....",
        ".....KKKGG...GGKKK.....",
        ".....KKKGG...GGKKK.....",
        ".....KKKGG...GGKKK.....",
        ".....KKKKK...KKKKK.....",
        ".....KKKKK...KKKKK....."
    ];

    const scaleB = 2.5;
    for (let r = 0; r < pixelMapBatman.length; r++) {
        for (let c = 0; c < pixelMapBatman[r].length; c++) {
            const char = pixelMapBatman[r][c];
            if (char === '.') continue;

            if (char === 'K') dBat.fillStyle = '#1e1e24';      // Preto/Cinza Escuro da Capa e Capuz
            else if (char === 'G') dBat.fillStyle = '#7a7e85'; // Cinza da Armadura
            else if (char === 'W') dBat.fillStyle = '#ffffff'; // Olhos Brancos
            else if (char === 'F') dBat.fillStyle = '#ffcc80'; // Pele do Rosto
            else if (char === 'E') dBat.fillStyle = '#d7ccc8'; // Detalhe da Boca
            else if (char === 'Y') dBat.fillStyle = '#d4a017'; // Cinto de Utilidades Amarelo

            dBat.fillRect(c * scaleB, r * scaleB, scaleB, scaleB);
        }
    }
    s.batman = cBat;

    // 4. Miguel Cadeira de Rodas
    const cMig = document.createElement('canvas'); 
    cMig.width = 64; 
    cMig.height = 64;
    const dMig = cMig.getContext('2d');

    const pixelMapMiguel = [
        "..................HH..............",
        ".............SHHH.HHHH............",
        "............SHHHHHHHHH............",
        "...........SHHHHHHHHHHH...........",
        "...........SHHHHHHHHHHH...........",
        "..........SHHFFFFFFFFFFHH.........",
        ".........SHHFFFEFFFEFFFFHH........",
        ".........SHHFFFFFFFFFFEEFF........",
        ".........SHHFFFFFEFFFFFFEE........",
        "..........SHFFFFFEEEEEEFFF........",
        "..........S.FFFFFFFFFF............",
        ".........S.AAACCCCCCCAAAA.........",
        "........S.AAAACCCCCCCAAAAA........",
        ".......S..AAAACCCCCCCAAAAAA.......",
        "......S...AAAACCCCCCCAAAAAAA......",
        ".....S....PPPPP.PPPPP.............",
        "....S....PPPPPP.PPPPPP............",
        "...S....PPPPPPP.PPPPPPP...........",
        "..S....WWWWWWWW.WWWWWWWW..........",
        ".......WWWWWWWW.WWWWWWWW..........",
        "........RRRRRR...RRRRRR...........",
        ".......RRRRRRRR.RRRRRRRR..........",
        "......RRRRRRRRRRRRRRRRRRR.........",
        "......RRRRRRRRRRRRRRRRRRR.........",
        ".......RRRRRRRR.RRRRRRRR..........",
        "........RRRRRR...RRRRRR...........",
        "..........R........R.............."
    ];

    const scaleM = 2;
    for (let r = 0; r < pixelMapMiguel.length; r++) {
        for (let c = 0; c < pixelMapMiguel[r].length; c++) {
            const char = pixelMapMiguel[r][c];
            if (char === '.') continue;

            if (char === 'H') dMig.fillStyle = '#6d4c41';      // Cabelo castanho
            else if (char === 'F') dMig.fillStyle = '#ffcc80'; // Pele
            else if (char === 'E') dMig.fillStyle = '#1a237e'; // Olhos / Sobrancelha
            else if (char === 'A') dMig.fillStyle = '#29b6f6'; // Camisola Azul Clara
            else if (char === 'P') dMig.fillStyle = '#263238'; // Calças Escuras
            else if (char === 'W') dMig.fillStyle = '#eceff1'; // Sapatilhas Brancas
            else if (char === 'S') dMig.fillStyle = '#b0bec5'; // Estrutura metálica da cadeira
            else if (char === 'C') dMig.fillStyle = '#1565c0'; // Encosto azul escuro
            else if (char === 'R') dMig.fillStyle = '#37474f'; // Roda com pneus escuros

            dMig.fillRect(c * scaleM, r * scaleM, scaleM, scaleM);
        }
    }
    s.miguel = cMig;

    // 5. Construções
    function criarPredio(corParede, rotulo) {
        const cP = document.createElement('canvas'); cP.width = 160; cP.height = 120;
        const dP = cP.getContext('2d');
        dP.fillStyle = corParede; dP.fillRect(10, 35, 140, 80);
        dP.strokeStyle = '#1a1a1a'; dP.lineWidth = 4; dP.strokeRect(10, 35, 140, 80);
        dP.fillStyle = '#b71c1c';
        dP.beginPath(); dP.moveTo(0,35); dP.lineTo(80,5); dP.lineTo(160,35); dP.closePath(); dP.fill(); dP.stroke();
        dP.fillStyle = '#4e342e'; dP.fillRect(65, 75, 30, 40); dP.strokeRect(65, 75, 30, 40);
        dP.fillStyle = '#fff8e1'; dP.fillRect(25, 50, 26, 26); dP.fillRect(109, 50, 26, 26);
        dP.strokeRect(25, 50, 26, 26); dP.strokeRect(109, 50, 26, 26);
        dP.fillStyle = '#ffffff'; dP.fillRect(20, 10, 120, 18); dP.strokeRect(20, 10, 120, 18);
        dP.fillStyle = '#000000'; dP.font = 'bold 11px sans-serif'; dP.textAlign = 'center';
        dP.fillText(rotulo, 80, 23);
        return cP;
    }

    s.casa_mariangela = criarPredio('#ef6c00', 'Casa Mariangela');
    s.casa_rosilene = criarPredio('#0277bd', 'Casa Rosilene');
    s.escola = criarPredio('#2e7d32', 'Escola');
    s.igreja = criarPredio('#6a1b9a', 'Igreja');

    return s;
}

const SPRITES = gerarSprites();

const player = { x: 448, y: 280, speed: 4 };

const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function update() {
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;

    player.x = Math.max(160, Math.min(canvas.width - 220, player.x));
    player.y = Math.max(20, Math.min(canvas.height - 80, player.y));
}

function draw() {
    // Gramado
    ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Estrada Central
    for (let y = 0; y < canvas.height; y += 64) {
        for (let x = 384; x < 576; x += 64) {
            ctx.drawImage(SPRITES.estrada, x, y);
        }
    }

    // Árvores Posicionadas nas Laterais
    const posX = [20, 90, 800, 870];
    for (let x of posX) {
        for (let y = 10; y < canvas.height; y += 120) {
            ctx.drawImage(SPRITES.arvore, x, y);
        }
    }

    // Construções
    ctx.drawImage(SPRITES.casa_mariangela, 180, 20);
    ctx.drawImage(SPRITES.casa_rosilene, 610, 20);
    ctx.drawImage(SPRITES.escola, 180, 480);
    ctx.drawImage(SPRITES.igreja, 610, 480);

    // Personagens
    ctx.drawImage(SPRITES.miguel, player.x, player.y);
    ctx.drawImage(SPRITES.batman, player.x + 40, player.y + 4);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
