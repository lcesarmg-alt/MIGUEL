<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As Aventuras de Miguel e Batman</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { margin-bottom: 10px; font-size: 24px; color: #ffd700; text-shadow: 2px 2px #000; }
        #canvas-container {
            position: relative;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background-color: #2e7d32;
        }
        canvas { display: block; }
        #ui {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            font-size: 16px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
        }
        .controls-hint { margin-top: 8px; color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

    <h1>🎮 As Aventuras de Miguel e Batman</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <div id="ui">
        <div>⭐ Pontuação: <span id="score">0</span></div>
        <div>❤️ Vidas: <span id="lives">3</span></div>
        <div>🏆 Nível: <span id="level">1</span></div>
    </div>
    <div class="controls-hint">Use as **Setas do Teclado** ou **WASD** para movimentar o Miguel e o Batman!</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let lives = 3;
let level = 1;

// Gerador de Texturas/Imagens dinâmicas via Canvas offline
function criarSprites() {
    const sprites = {};

    // 1. Árvore
    const cArv = document.createElement('canvas'); cArv.width = 64; cArv.height = 64;
    const dArv = cArv.getContext('2d');
    dArv.fillStyle = '#3a200d'; dArv.fillRect(26, 42, 12, 22);
    dArv.fillStyle = '#1b4d20'; dArv.beginPath(); dArv.arc(32, 36, 26, 0, Math.PI*2); dArv.fill();
    dArv.fillStyle = '#2e7d32'; dArv.beginPath(); dArv.arc(32, 24, 22, 0, Math.PI*2); dArv.fill();
    dArv.fillStyle = '#4caf50'; dArv.beginPath(); dArv.arc(32, 12, 16, 0, Math.PI*2); dArv.fill();
    sprites.arvore = cArv;

    // 2. Estrada
    const cEst = document.createElement('canvas'); cEst.width = 48; cEst.height = 48;
    const dEst = cEst.getContext('2d');
    dEst.fillStyle = '#616161'; dEst.fillRect(0, 0, 48, 48);
    dEst.strokeStyle = '#424242'; dEst.lineWidth = 2;
    for(let i=0; i<48; i+=12){ dEst.strokeRect(0, i, 48, 12); }
    sprites.estrada = cEst;

    // 3. Batman
    const cBat = document.createElement('canvas'); cBat.width = 48; cBat.height = 48;
    const dBat = cBat.getContext('2d');
    dBat.fillStyle = '#111'; dBat.fillRect(10, 16, 28, 28); // Capa
    dBat.fillStyle = '#212121'; dBat.fillRect(14, 12, 20, 26); // Corpo
    dBat.fillStyle = '#FFD54F'; dBat.fillRect(14, 26, 20, 5); // Cinto
    dBat.fillStyle = '#000'; // Máscara/Orelhas
    dBat.beginPath(); dBat.moveTo(14,12); dBat.lineTo(18,2); dBat.lineTo(22,12); dBat.fill();
    dBat.beginPath(); dBat.moveTo(26,12); dBat.lineTo(30,2); dBat.lineTo(34,12); dBat.fill();
    dBat.fillStyle = '#FFF'; dBat.fillRect(18, 14, 4, 3); dBat.fillRect(26, 14, 4, 3); // Olhos
    dBat.fillStyle = '#00E5FF'; dBat.fillRect(36, 10, 4, 24); // Sabro/Espada de luz
    sprites.batman = cBat;

    // 4. Miguel (Cadeira de Rodas)
    const cMig = document.createElement('canvas'); cMig.width = 48; cMig.height = 48;
    const dMig = cMig.getContext('2d');
    dMig.strokeStyle = '#1565C0'; dMig.lineWidth = 4;
    dMig.beginPath(); dMig.arc(16, 32, 12, 0, Math.PI*2); dMig.stroke(); // Roda esq
    dMig.beginPath(); dMig.arc(32, 32, 12, 0, Math.PI*2); dMig.stroke(); // Roda dir
    dMig.fillStyle = '#424242'; dMig.fillRect(16, 20, 16, 14); // Assento
    dMig.fillStyle = '#FFCC80'; dMig.fillRect(18, 8, 12, 12); // Rosto
    dMig.fillStyle = '#1E88E5'; dMig.fillRect(16, 18, 16, 10); // Camisa
    sprites.miguel = cMig;

    // 5. Coringa
    const cCor = document.createElement('canvas'); cCor.width = 48; cCor.height = 48;
    const dCor = cCor.getContext('2d');
    dCor.fillStyle = '#6A1B9A'; dCor.fillRect(14, 14, 20, 26); // Terno
    dCor.fillStyle = '#2E7D32'; dCor.fillRect(16, 4, 16, 8);   // Cabelo
    dCor.fillStyle = '#FFFFFF'; dCor.fillRect(16, 10, 16, 10); // Rosto
    dCor.fillStyle = '#FF1744'; dCor.fillRect(36, 10, 4, 24);  // Espada Vermelha
    sprites.coringa = cCor;

    // Função interna para criar Prédios/Casas
    function criarConstrucao(corParede, rotulo) {
        const cB = document.createElement('canvas'); cB.width = 140; cB.height = 110;
        const dB = cB.getContext('2d');
        dB.fillStyle = corParede; dB.fillRect(10, 30, 120, 70);
        dB.strokeStyle = '#212121'; dB.lineWidth = 3; dB.strokeRect(10, 30, 120, 70);
        // Telhado
        dB.fillStyle = '#D32F2F';
        dB.beginPath(); dB.moveTo(0,30); dB.lineTo(70,5); dB.lineTo(140,30); dB.closePath(); dB.fill(); dB.stroke();
        // Porta
        dB.fillStyle = '#5D4037'; dB.fillRect(55, 65, 30, 35);
        // Janelas
        dB.fillStyle = '#FFF8E1'; dB.fillRect(25, 45, 20, 20); dB.fillRect(95, 45, 20, 20);
        // Placa
        dB.fillStyle = '#FFF'; dB.fillRect(20, 100, 100, 10);
        dB.fillStyle = '#000'; dB.font = 'bold 9px sans-serif'; dB.textAlign = 'center';
        dB.fillText(rotulo, 70, 108);
        return cB;
    }

    sprites.casa_mariangela = criarConstrucao('#FB8C00', 'Casa Mariangela');
    sprites.casa_rosilene = criarConstrucao('#0288D1', 'Casa Rosilene');
    sprites.escola = criarConstrucao('#43A047', 'Escola');
    sprites.igreja = criarConstrucao('#8E24AA', 'Igreja');

    return sprites;
}

const SPRITES = criarSprites();

// Posição do jogador
const player = {
    x: 376,
    y: 276,
    speed: 4,
    size: 48
};

// Posição do Vilão (Coringa)
const enemy = {
    x: 100,
    y: 100,
    speed: 1.5,
    size: 48
};

// Mapeamento do Teclado
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function update() {
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;

    // Limites da tela
    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    // Perseguição do Coringa
    if (enemy.x < player.x) enemy.x += enemy.speed;
    if (enemy.x > player.x) enemy.x -= enemy.speed;
    if (enemy.y < player.y) enemy.y += enemy.speed;
    if (enemy.y > player.y) enemy.y -= enemy.speed;

    // Colisão do Coringa com o Miguel/Batman
    const dist = Math.hypot((player.x + 24) - (enemy.x + 24), (player.y + 24) - (enemy.y + 24));
    if (dist < 32) {
        lives--;
        document.getElementById('lives').textContent = lives;
        player.x = 376; player.y = 276;
        enemy.x = 50; enemy.y = 50;
        if (lives <= 0) {
            alert("Fim de Jogo! O Miguel e o Batman vão tentar novamente!");
            score = 0; lives = 3;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
        }
    }
}

function draw() {
    // 1. Gramado (Fundo)
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Estradas
    for(let x = 0; x < canvas.width; x += 48) {
        ctx.drawImage(SPRITES.estrada, x, 276);
    }
    for(let y = 0; y < canvas.height; y += 48) {
        ctx.drawImage(SPRITES.estrada, 376, y);
    }

    // 3. Edifícios
    ctx.drawImage(SPRITES.casa_mariangela, 40, 40);
    ctx.drawImage(SPRITES.casa_rosilene, 620, 40);
    ctx.drawImage(SPRITES.escola, 40, 440);
    ctx.drawImage(SPRITES.igreja, 620, 440);

    // 4. Árvores decorativas
    ctx.drawImage(SPRITES.arvore, 240, 80);
    ctx.drawImage(SPRITES.arvore, 500, 80);
    ctx.drawImage(SPRITES.arvore, 240, 460);
    ctx.drawImage(SPRITES.arvore, 500, 460);

    // 5. Coringa (Inimigo)
    ctx.drawImage(SPRITES.coringa, enemy.x, enemy.y);

    // 6. Miguel e Batman (Lado a Lado)
    ctx.drawImage(SPRITES.miguel, player.x, player.y);
    ctx.drawImage(SPRITES.batman, player.x + 28, player.y - 10);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
