<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As Aventuras de Miguel e Batman</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { margin-bottom: 8px; font-size: 26px; color: #ffd700; text-shadow: 2px 2px 4px #000; }
        #canvas-container {
            position: relative;
            border: 4px solid #222;
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.9);
            background-color: #1e4620;
        }
        canvas { display: block; image-rendering: pixelated; }
        #ui {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.75);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #444;
        }
        .hint { margin-top: 6px; color: #aaa; font-size: 13px; }

        /* Contêiner do Modal + Balão lado a lado */
        #modal-container-wrapper {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            flex-direction: row;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        /* Modal Interativo */
        #interactive-modal {
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #0277bd;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 300px;
        }
        #interactive-modal h2 {
            color: #4fc3f7;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .modal-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0288d1;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-btn:hover { background: #039be5; }
        .modal-btn.close { background: #546e7a; margin-top: 15px; }
        .modal-btn.close:hover { background: #78909c; }

        /* Canvas do Balão da Piscina acoplado ao lado do menu */
        #balloon-canvas-preview {
            border-radius: 8px;
            background: transparent;
        }
    </style>
</head>
<body>

    <h1>⚔️ As Aventuras de Miguel e Batman</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="960" height="640"></canvas>

        <!-- Menu e Balão da Piscina ao Lado Direito -->
        <div id="modal-container-wrapper">
            <div id="interactive-modal">
                <h2 id="modal-title">🏡 Casa da Vovó Rosilene</h2>
                <p style="margin-bottom: 15px; color: #ddd; font-size: 14px;">O que os meninos querem fazer agora?</p>
                <button class="modal-btn" onclick="escolherOpcao('piscina')">🏊‍♂️ Ir para a Piscina</button>
                <button class="modal-btn" onclick="escolherOpcao('vovo')">👴 Brincar com o Vovô</button>
                <button class="modal-btn close" onclick="fecharModal()">Voltar ao Mapa</button>
            </div>

            <!-- Canvas que desenha o balão da piscina ao lado do menu -->
            <canvas id="balloon-canvas-preview" width="360" height="230"></canvas>
        </div>
    </div>

    <div id="ui">
        <div>⭐ Pontos: <span id="score" style="color: #ffd700;">0</span></div>
        <div>❤️ Vidas: <span id="lives" style="color: #ff4d4d;">3</span></div>
        <div>🏆 Nível: <span id="level" style="color: #00e5ff;">1</span></div>
    </div>
    <div class="hint">Use as setas ou WASD para caminhar pela calçada até a Casa da Vovó!</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const balloonCanvas = document.getElementById('balloon-canvas-preview');
const balloonCtx = balloonCanvas.getContext('2d');

let cenaAtual = 'mapa';
let modalAberto = false;

// Controle de Animação de Caminhada
let walkFrame = 0;
let walkTimer = 0;
let isWalking = false;

function gerarSprites() {
    const s = {};

    // 1. ÁRVORE ORIGINAL EM MATRIZ DE PIXELS (Estilo das 3 atualizações atrás)
    const cTree = document.createElement('canvas'); 
    cTree.width = 64; cTree.height = 96;
    const dT = cTree.getContext('2d');
    const pixelMapTree = [
        ".................BBBB...........",
        "...............BBGGGBB..........",
        "..............BGGGGGGGB.........",
        "............BBGGGGGGGGGBB.......",
        "...........BGGGGGGGGGGGGGB......",
        "..........BGGGGGGGGGGGGGGGB.....",
        ".........BGGGGGGGGGGGGGGGGGB....",
        "........BGGGGBBBGGGGGGGGGGGB....",
        "........BGGGBBBBGGGGGBBBGGGB....",
        ".......BGGGGBBBBBGGGBBBBGGGGB...",
        "......BGGGGGBBBBBBGGBBBBBGGGB...",
        "......BGGGGGGBBBBBBBBBBBGGGGB...",
        ".....BGGGGGGGBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGGGBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGBBBBBBBBBBBBGGGGGB..",
        "....BGGGGGGGBBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGBBBBBBBBBBBBGGGGGB..",
        ".....BGGGGGGGBBBBBBBBBBGGGGGB...",
        "......BGGGGGGGBBBBBBBBGGGGGB....",
        "......BGGGGGGGGBBBBBGGGGGGGB....",
        ".......BGGGGGGGGGGGGGGGGGGGB....",
        "........BGGGGGGGGGGGGGGGGGB.....",
        ".........BBGGGGGGGGGGGGGBB......",
        "...........BBGGGGGGGGGBB........",
        ".............BBBBBBBBB..........",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "...............BTTTB............",
        "..............BBTTTBB...........",
        ".............BTTTTTTTB..........",
        ".............BGGGGGGGB..........",
        "..............BBBBBBB..........."
    ];
    const scaleTree = 2;
    for (let r = 0; r < pixelMapTree.length; r++) {
        for (let c = 0; c < pixelMapTree[r].length; c++) {
            const char = pixelMapTree[r][c];
            if (char === '.') continue;
            if (char === 'B') dT.fillStyle = '#000000';
            else if (char === 'G') {
                if (r < 10) dT.fillStyle = '#4ae24a';
                else if (r < 20) dT.fillStyle = '#22b14c';
                else dT.fillStyle = '#158033';
            }
            else if (char === 'T') dT.fillStyle = '#8b4513';
            dT.fillRect(c * scaleTree, r * scaleTree, scaleTree, scaleTree);
        }
    }
    s.arvore = cTree;

    // 2. Estrada e Calçada
    const cRoad = document.createElement('canvas'); cRoad.width = 64; cRoad.height = 64;
    const dR = cRoad.getContext('2d');
    dR.fillStyle = '#44444c'; dR.fillRect(0,0,64,64);
    for(let y=0; y<64; y+=16) {
        dR.fillStyle = '#323238'; dR.fillRect(0, y, 64, 2);
    }
    dR.fillStyle = '#f5b041'; dR.fillRect(30, 0, 4, 64);
    s.estrada = cRoad;

    const cSidewalk = document.createElement('canvas'); cSidewalk.width = 64; cSidewalk.height = 64;
    const dS = cSidewalk.getContext('2d');
    dS.fillStyle = '#b0bec5'; dS.fillRect(0,0,64,64);
    dS.fillStyle = '#78909c';
    for(let i=0; i<64; i+=16) {
        dS.fillRect(i, 0, 2, 64);
        dS.fillRect(0, i, 64, 2);
    }
    s.calcada = cSidewalk;

    // 3. BATMAN DE ALTA DEFINIÇÃO (Sem formato de rato, orelhas pontiagudas, capa e cinto)
    s.drawBatman = function(ctx, x, y, frame) {
        const offsetLeft = (frame === 1) ? -2 : 0;
        const offsetRight = (frame === 2) ? 2 : 0;

        ctx.save();
        ctx.translate(x, y);

        // Capa
        ctx.fillStyle = '#111318';
        ctx.beginPath();
        ctx.moveTo(2, 14);
        ctx.lineTo(30, 14);
        ctx.lineTo(34, 48);
        ctx.lineTo(-2, 48);
        ctx.closePath();
        ctx.fill();

        // Botas e Pernas
        ctx.fillStyle = '#222630';
        ctx.fillRect(8, 34 + offsetLeft, 6, 14);
        ctx.fillRect(18, 34 + offsetRight, 6, 14);

        ctx.fillStyle = '#0a0b0e';
        ctx.fillRect(7, 43 + offsetLeft, 8, 5);
        ctx.fillRect(17, 43 + offsetRight, 8, 5);

        // Tronco
        ctx.fillStyle = '#3a3f4d';
        ctx.fillRect(8, 14, 16, 20);

        // Cinto de Utilidades Ouro
        ctx.fillStyle = '#fbc02d';
        ctx.fillRect(7, 28, 18, 4);
        ctx.fillStyle = '#f57f17';
        ctx.fillRect(13, 27, 6, 6);

        // Símbolo do Peito
        ctx.fillStyle = '#0a0b0e';
        ctx.beginPath();
        ctx.ellipse(16, 20, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Braços
        ctx.fillStyle = '#282c37';
        ctx.fillRect(4, 15, 4, 14);
        ctx.fillRect(24, 15, 4, 14);

        // Máscara e Capuz
        ctx.fillStyle = '#111318';
        ctx.fillRect(9, 4, 14, 11);
        
        // Orelhas Pontiagudas do Batman
        ctx.beginPath();
        ctx.moveTo(9, 6); ctx.lineTo(8, -4); ctx.lineTo(12, 4); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(23, 6); ctx.lineTo(24, -4); ctx.lineTo(20, 4); ctx.closePath(); ctx.fill();

        // Rosto à mostra
        ctx.fillStyle = '#ffcc80';
        ctx.fillRect(12, 10, 8, 5);

        // Olhos Brancos Angulados
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(10, 7); ctx.lineTo(14, 8); ctx.lineTo(11, 9); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(22, 7); ctx.lineTo(18, 8); ctx.lineTo(21, 9); ctx.closePath(); ctx.fill();

        ctx.restore();
    };

    // 4. Miguel
    s.drawMiguel = function(ctx, x, y, frame) {
        const offsetLeft = (frame === 1) ? -2 : 0;
        const offsetRight = (frame === 2) ? 2 : 0;

        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = '#263238';
        ctx.fillRect(6, 32 + offsetLeft, 6, 12);
        ctx.fillRect(16, 32 + offsetRight, 6, 12);
        ctx.fillStyle = '#37474f';
        ctx.fillRect(5, 41 + offsetLeft, 8, 5);
        ctx.fillRect(15, 41 + offsetRight, 8, 5);

        ctx.fillStyle = '#29b6f6'; ctx.fillRect(6, 16, 16, 16);
        ctx.fillStyle = '#1565c0'; ctx.fillRect(11, 18, 6, 12);

        ctx.fillStyle = '#ffcc80'; ctx.fillRect(7, 5, 14, 12);
        ctx.fillStyle = '#6d4c41'; ctx.fillRect(5, 1, 18, 6);

        ctx.restore();
    };

    // 5. Construções
    function criarPredio(corParede, rotulo) {
        const cP = document.createElement('canvas'); cP.width = 160; cP.height = 120;
        const dP = cP.getContext('2d');
        dP.fillStyle = corParede; dP.fillRect(10, 35, 140, 80);
        dP.strokeStyle = '#1a1a1a'; dP.lineWidth = 4; dP.strokeRect(10, 35, 140, 80);
        dP.fillStyle = '#b71c1c';
        dP.beginPath(); dP.moveTo(0,35); dP.lineTo(80,5); dP.lineTo(160,35); dP.closePath(); dP.fill(); dP.stroke();
        dP.fillStyle = '#4e342e'; dP.fillRect(65, 75, 30, 40); dP.strokeRect(65, 75, 30, 40);
        dP.fillStyle = '#fff8e1'; dP.fillRect(25, 50, 26, 26); dP.fillRect(109, 50, 26, 26);
        dP.strokeRect(25, 50, 26, 26); dP.strokeRect(109, 50, 26, 26);
        dP.fillStyle = '#ffffff'; dP.fillRect(20, 10, 120, 18); dP.strokeRect(20, 10, 120, 18);
        dP.fillStyle = '#000000'; dP.font = 'bold 11px sans-serif'; dP.textAlign = 'center';
        dP.fillText(rotulo, 80, 23);
        return cP;
    }

    s.casa_mariangela = criarPredio('#ef6c00', 'Casa Mariangela');
    s.casa_rosilene = criarPredio('#0277bd', 'Casa Rosilene');
    s.escola = criarPredio('#2e7d32', 'Escola');
    s.igreja = criarPredio('#6a1b9a', 'Igreja');

    // 6. Imagem Interna da Piscina
    const cPiscina = document.createElement('canvas'); cPiscina.width = 340; cPiscina.height = 200;
    const dP = cPiscina.getContext('2d');

    dP.fillStyle = '#87ceeb'; dP.fillRect(0, 0, 340, 70);
    dP.fillStyle = '#4caf50';
    dP.beginPath(); dP.arc(50, 60, 30, 0, Math.PI*2); dP.arc(80, 55, 40, 0, Math.PI*2); dP.fill();
    dP.beginPath(); dP.arc(240, 60, 30, 0, Math.PI*2); dP.arc(280, 50, 35, 0, Math.PI*2); dP.fill();

    dP.fillStyle = '#ffe0b2'; dP.fillRect(0, 70, 340, 130);

    dP.fillStyle = '#0288d1'; dP.beginPath();
    dP.moveTo(90, 90); dP.lineTo(250, 90); dP.lineTo(310, 180); dP.lineTo(30, 180); dP.closePath(); dP.fill();

    dP.fillStyle = '#29b6f6'; dP.beginPath();
    dP.moveTo(96, 96); dP.lineTo(244, 96); dP.lineTo(300, 174); dP.lineTo(40, 174); dP.closePath(); dP.fill();

    dP.strokeStyle = 'rgba(255,255,255,0.8)'; dP.lineWidth = 2;
    dP.beginPath(); dP.moveTo(130, 96); dP.lineTo(110, 174); dP.stroke();
    dP.beginPath(); dP.moveTo(170, 96); dP.lineTo(170, 174); dP.stroke();
    dP.beginPath(); dP.moveTo(210, 96); dP.lineTo(230, 174); dP.stroke();

    dP.fillStyle = '#ec407a'; dP.beginPath(); dP.arc(290, 75, 20, Math.PI, 0); dP.fill();
    dP.strokeStyle = '#5d4037'; dP.lineWidth = 2; dP.beginPath(); dP.moveTo(290, 75); dP.lineTo(290, 105); dP.stroke();

    s.piscina_img = cPiscina;

    return s;
}

const SPRITES = gerarSprites();
const player = { x: 330, y: 300, speed: 3.5 };

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'Escape' && cenaAtual !== 'mapa') voltarAoMapa();
});
window.addEventListener('keyup', e => keys[e.key] = false);

function abrirModalCasaRosilene() {
    if (!modalAberto && cenaAtual === 'mapa') {
        modalAberto = true;
        document.getElementById('modal-container-wrapper').style.display = 'flex';
        desenharBalãoNoCanvasDoModal();
    }
}

function fecharModal() {
    modalAberto = false;
    document.getElementById('modal-container-wrapper').style.display = 'none';
}

function escolherOpcao(opcao) {
    fecharModal();
    cenaAtual = opcao;
}

function voltarAoMapa() {
    cenaAtual = 'mapa';
    player.x = 610;
    player.y = 150;
}

function desenharBalãoNoCanvasDoModal() {
    const bCtx = balloonCtx;
    bCtx.clearRect(0, 0, balloonCanvas.width, balloonCanvas.height);

    const x = 30, y = 10, largura = 310, altura = 180;
    const p = 6;

    // Conteúdo da Piscina Recortado dentro do balão
    bCtx.save();
    bCtx.beginPath();
    bCtx.rect(x + p*2, y + p, largura - p*4, altura - p*2);
    bCtx.rect(x + p, y + p*2, largura - p*2, altura - p*4);
    bCtx.clip();
    bCtx.drawImage(SPRITES.piscina_img, x, y, largura, altura - p*2);
    bCtx.restore();

    // Borda Pixel Art do Balão
    bCtx.fillStyle = '#000000';
    bCtx.fillRect(x + p*2, y, largura - p*4, p);
    bCtx.fillRect(x + p*2, y + altura - p*3, largura - p*4, p);
    bCtx.fillRect(x, y + p*2, p, altura - p*5);
    bCtx.fillRect(x + largura - p, y + p*2, p, altura - p*5);

    bCtx.fillRect(x + p, y + p, p, p);
    bCtx.fillRect(x + largura - p*2, y + p, p, p);
    bCtx.fillRect(x + p, y + altura - p*4, p, p);
    bCtx.fillRect(x + largura - p*2, y + altura - p*4, p, p);

    // Ponta do Balão apontando para a esquerda (direção do menu)
    bCtx.fillStyle = '#000000';
    bCtx.fillRect(x - p, y + altura / 2, p*2, p*3);
    bCtx.fillRect(x - p*2, y + altura / 2 + p, p, p);

    bCtx.fillStyle = '#ffffff';
    bCtx.fillRect(x, y + altura / 2 + p, p, p);
}

function update() {
    if (modalAberto) return;

    isWalking = false;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) { player.y -= player.speed; isWalking = true; }
    if (keys['ArrowDown'] || keys['s'] || keys['S']) { player.y += player.speed; isWalking = true; }
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) { player.x -= player.speed; isWalking = true; }
    if (keys['ArrowRight'] || keys['d'] || keys['D']) { player.x += player.speed; isWalking = true; }

    if (isWalking) {
        walkTimer++;
        if (walkTimer % 8 === 0) {
            walkFrame = (walkFrame === 1) ? 2 : 1;
        }
    } else {
        walkFrame = 0;
    }

    if (cenaAtual === 'mapa') {
        player.x = Math.max(160, Math.min(canvas.width - 220, player.x));
        player.y = Math.max(20, Math.min(canvas.height - 80, player.y));

        if (player.x > 550 && player.x < 750 && player.y > 10 && player.y < 120) {
            abrirModalCasaRosilene();
        }
    } else {
        player.x = Math.max(50, Math.min(canvas.width - 120, player.x));
        player.y = Math.max(200, Math.min(canvas.height - 100, player.y));
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (cenaAtual === 'mapa') {
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Estrada Central
        for (let y = 0; y < canvas.height; y += 64) {
            for (let x = 416; x < 544; x += 64) {
                ctx.drawImage(SPRITES.estrada, x, y);
            }
        }

        // Calçada
        for (let y = 0; y < canvas.height; y += 64) {
            ctx.drawImage(SPRITES.calcada, 352, y);
            ctx.drawImage(SPRITES.calcada, 544, y);
        }

        // ÁRVORES RESTAURADAS NAS LATERAIS
        const posX = [20, 90, 800, 870];
        for (let x of posX) {
            for (let y = 10; y < canvas.height; y += 120) {
                ctx.drawImage(SPRITES.arvore, x, y);
            }
        }

        ctx.drawImage(SPRITES.casa_mariangela, 180, 20);
        ctx.drawImage(SPRITES.casa_rosilene, 610, 20);
        ctx.drawImage(SPRITES.escola, 180, 480);
        ctx.drawImage(SPRITES.igreja, 610, 480);

        SPRITES.drawMiguel(ctx, player.x, player.y, walkFrame);
        SPRITES.drawBatman(ctx, player.x + 32, player.y - 2, walkFrame);

    } else if (cenaAtual === 'piscina') {
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < canvas.height; y += 64) {
            ctx.drawImage(SPRITES.calcada, 352, y);
            ctx.drawImage(SPRITES.calcada, 544, y);
        }
        ctx.drawImage(SPRITES.casa_rosilene, 610, 20);

        // Imagem grande da Piscina na Tela
        ctx.drawImage(SPRITES.piscina_img, 280, 90, 400, 240);

        SPRITES.drawMiguel(ctx, player.x, player.y, walkFrame);
        SPRITES.drawBatman(ctx, player.x + 32, player.y - 2, walkFrame);

        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(10, 10, 340, 36);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
        ctx.fillText('🏊‍♂️ Na Piscina! (Pressione ESC para voltar ao mapa)', 20, 33);

    } else if (cenaAtual === 'vovo') {
        ctx.fillStyle = '#5d4037'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#d7ccc8'; ctx.fillRect(40, 40, 880, 560);

        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(10, 10, 360, 36);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
        ctx.fillText('👴 Brincando com o Vovô! (Pressione ESC para voltar)', 20, 33);

        SPRITES.drawMiguel(ctx, player.x, player.y, walkFrame);
        SPRITES.drawBatman(ctx, player.x + 32, player.y - 2, walkFrame);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
